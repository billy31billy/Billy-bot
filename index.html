<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Ultimate Media Platform</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

header{
background:#e50914;
padding:15px;
text-align:center;
font-weight:bold;
}

/* login */
#login{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

input,button{
padding:10px;
margin:5px;
border:none;
}

button{
background:#e50914;
color:white;
cursor:pointer;
}

/* tabs */
.tabs{display:flex}
.tab{
flex:1;
padding:12px;
text-align:center;
background:#1c1c1c;
cursor:pointer;
}
.tab.active{background:#e50914}

.section{display:none;padding:10px}
.section.active{display:block}

/* movies */
.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.card{
width:160px;
background:#222;
margin:10px;
border-radius:10px;
overflow:hidden;
}

.card img{width:100%}
.card h4{font-size:13px;padding:5px}
.rate{color:gold;padding:5px}

.smallbtn{
padding:5px;
font-size:12px;
width:100%;
}

/* chat */
.chat{
height:300px;
overflow:auto;
background:#1c1c1c;
padding:10px;
border-radius:10px;
}

.msg{margin:5px;padding:6px;border-radius:6px}
.user{background:#e50914;text-align:right}
.bot{background:#333}

/* admin */
.panel{
background:#1c1c1c;
padding:10px;
border-radius:10px;
}
</style>
</head>

<body>

<header>🎬 Ultimate Media Platform</header>

<!-- LOGIN -->
<div id="login">
<h2>تسجيل دخول</h2>
<input id="u" placeholder="اسمك">
<button onclick="enter()">دخول</button>
</div>

<!-- TABS -->
<div class="tabs">
<div class="tab active" onclick="openTab(0)">🎬 المحتوى</div>
<div class="tab" onclick="openTab(1)">⭐ مفضلتي</div>
<div class="tab" onclick="openTab(2)">💬 الشات</div>
<div class="tab" onclick="openTab(3)">⚙️ الإدارة</div>
</div>

<!-- MOVIES -->
<div class="section active" id="t0">
<div>
<select onchange="filter(this.value)">
<option value="movie">أفلام</option>
<option value="tv">مسلسلات</option>
</select>
</div>

<div class="grid" id="list"></div>
</div>

<!-- FAVORITES -->
<div class="section" id="t1">
<h3>⭐ مفضلتي</h3>
<div class="grid" id="fav"></div>
</div>

<!-- CHAT -->
<div class="section" id="t2">
<div class="chat" id="chat"></div>
<input id="msg" placeholder="اكتب سؤالك">
<button onclick="send()">إرسال</button>
</div>

<!-- ADMIN -->
<div class="section" id="t3">
<div class="panel">
<h3>لوحة الإدارة</h3>
<p>المستخدم: <span id="usern"></span></p>
<p>عدد المفضلة: <span id="fc"></span></p>
</div>
</div>

<script>

const API="YOUR_TMDB_API_KEY";
const OPENAI="YOUR_OPENAI_API_KEY"; // اختياري

let user="";
let type="movie";

let favs = JSON.parse(localStorage.getItem("fav")||"[]");

/* login */
function enter(){
user=document.getElementById("u").value;
if(!user) return;

document.getElementById("login").style.display="none";
document.getElementById("usern").innerText=user;

notify("مرحبا "+user);
load();
}

/* tabs */
function openTab(i){
document.querySelectorAll(".tab").forEach((t,x)=>{
t.classList.toggle("active",x===i);
});
document.querySelectorAll(".section").forEach((s,x)=>{
s.classList.toggle("active",x===i);
});
}

/* notify */
function notify(t){
if(Notification.permission!=="granted")
Notification.requestPermission();
else new Notification(t);
}

/* load */
function load(){
fetch(`https://api.themoviedb.org/3/${type}/popular?api_key=${API}&language=ar`)
.then(r=>r.json())
.then(d=>{
let box=document.getElementById("list");
box.innerHTML="";

d.results.forEach(m=>{
box.innerHTML+=`
<div class="card">
<img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
<h4>${m.title||m.name}</h4>
<div class="rate">⭐ ${m.vote_average}</div>
<button class="smallbtn" onclick='addFav(${JSON.stringify(m)})'>⭐ إضافة</button>
</div>`;
});
});
}

/* filter */
function filter(v){
type=v;
load();
}

/* fav */
function addFav(m){
favs.push(m);
localStorage.setItem("fav",JSON.stringify(favs));
renderFav();
}

/* render fav */
function renderFav(){
let f=document.getElementById("fav");
f.innerHTML="";

favs.forEach(m=>{
f.innerHTML+=`
<div class="card">
<img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
<h4>${m.title||m.name}</h4>
</div>`;
});

document.getElementById("fc").innerText=favs.length;
}
renderFav();

/* chat */
function send(){
let i=document.getElementById("msg");
let t=i.value;
if(!t) return;

add(t,"user");
i.value="";

setTimeout(async ()=>{
add(await bot(t),"bot");
},500);
}

function add(t,type){
document.getElementById("chat").innerHTML+=
`<div class="msg ${type}">${t}</div>`;
}

/* AI */
async function bot(t){
t=t.toLowerCase();

if(t.includes("مرحبا")) return "أهلا 👋";
if(t.includes("فيلم")) return "شاهد قسم المحتوى 🎬";
if(t.includes("اسمك")) return "أنا مساعدك الذكي 🤖";

if(OPENAI && OPENAI.includes("sk-")){
try{
let r=await fetch("https://api.openai.com/v1/chat/completions",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+OPENAI
},
body:JSON.stringify({
model:"gpt-4o-mini",
messages:[{role:"user",content:t}]
})
});

let d=await r.json();
return d.choices[0].message.content;
}catch(e){
return "خطأ في الذكاء الاصطناعي";
}
}

return "لم أفهم 🤖";
}

/* init */
renderFav();
load();

</script>

</body>
</html>
